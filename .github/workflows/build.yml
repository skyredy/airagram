name: CI

on:
  push:
    branches: [ master ]

  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: '0'

      - name: Set active Xcode path
        run: |
          XCODE_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["xcode"]);')
          XCODE_PATH="/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          if [ -d "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH"
          else
            echo "Xcode $XCODE_VERSION not preinstalled on this runner, available versions:"
            ls /Applications | grep Xcode
            echo "Falling back to the runner's default Xcode and relying on --overrideXcodeVersion."
          fi
          xcodebuild -version

      - name: Create canonical source directory
        run: |
          set -x
          sudo mkdir -p /Users/Shared
          cp -R $GITHUB_WORKSPACE /Users/Shared/
          mv /Users/Shared/$(basename $GITHUB_WORKSPACE) /Users/Shared/telegram-ios

      - name: Prepare bazel cache directory
        run: |
          sudo mkdir -p /private/var/tmp/_bazel_containerhost
          sudo chown -R $(whoami) /private/var/tmp/_bazel_containerhost

      - name: Restore bazel cache
        uses: actions/cache/restore@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            bazel-${{ runner.os }}-

      # Our own bundle id on purpose: ph.telegra.Telegraph is in
      # Telegram/BUILD's official_bundle_ids, which switches on entitlements
      # Apple only grants to the official app, and an app carrying those
      # cannot be re-signed - it dies at launch with a black screen.
      - name: Write build configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd /Users/Shared/telegram-ios
          if [ -z "$API_ID" ] || [ -z "$API_HASH" ]; then
            echo "warning: API_ID / API_HASH secrets are not set, building with placeholders"
          fi
          cat > build-system/ci-configuration.json <<EOF
          {
           "bundle_id": "org.a74d5e43279953af.airagram",
           "api_id": "${API_ID:-1}",
           "api_hash": "${API_HASH:-00000000000000000000000000000000}",
           "team_id": "AIRAGRM001",
           "app_center_id": "0",
           "is_internal_build": "true",
           "is_appstore_build": "false",
           "appstore_id": "0",
           "app_specific_url_scheme": "airagram",
           "premium_iap_product_id": "",
           "enable_siri": false,
           "enable_icloud": false
          }
          EOF
          grep -c api_hash build-system/ci-configuration.json

      - name: Build the App
        run: |
          set -x

          # source code paths are included in the final binary, so we need to make them stable across builds
          SOURCE_DIR=/Users/Shared/telegram-ios

          # use canonical bazel root
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"

          cd $SOURCE_DIR

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"

          export APP_VERSION=$(cat versions.json | python3 -c 'import json,sys;obj=json.load(sys.stdin);print(obj["app"]);')
          export COMMIT_COUNT=$(git rev-list --count HEAD)
          export COMMIT_COUNT="$(($COMMIT_COUNT+$BUILD_NUMBER_OFFSET))"
          export BUILD_NUMBER="$COMMIT_COUNT"
          echo "BUILD_NUMBER=$(echo $BUILD_NUMBER)" >> $GITHUB_ENV
          echo "APP_VERSION=$(echo $APP_VERSION)" >> $GITHUB_ENV

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning-airagram/certs
          python3 -u build-system/Make/Make.py \
            --overrideXcodeVersion \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/ci-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning-airagram \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

      # Saved even when the build fails, so a run that dies partway leaves its
      # compiled output for the next run instead of starting over.
      - name: Save bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /private/var/tmp/_bazel_containerhost
          key: bazel-${{ runner.os }}-${{ github.run_id }}

      - name: Collect ipa and dSYMs
        run: |
          set -x
          cd /Users/Shared/telegram-ios

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"

          # bazel-bin is a symlink into the bazel root, so -L is required for find
          IPA_PATH="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$IPA_PATH" ]; then
            IPA_PATH="$(find -L bazel-out -path '*/bin/Telegram/Telegram.ipa' -type f | head -1)"
          fi
          if [ ! -f "$IPA_PATH" ]; then
            echo "Could not find a built ipa"
            exit 1
          fi
          cp "$IPA_PATH" "$OUTPUT_PATH/Airagram.ipa"

          mkdir -p build/DSYMs
          find -L bazel-bin/Telegram -maxdepth 1 -name '*.dSYM' -exec cp -R {} build/DSYMs/ \; || true
          zip -r "./$OUTPUT_PATH/Airagram.DSYMs.zip" build/DSYMs 1>/dev/null || true

          ls -la "$OUTPUT_PATH"

      - name: Upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: Airagram-${{ env.APP_VERSION }}-${{ env.BUILD_NUMBER }}
          path: /Users/Shared/telegram-ios/build/artifacts
          if-no-files-found: error
          retention-days: 30
