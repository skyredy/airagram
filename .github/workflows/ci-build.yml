name: CI build (simulator, unsigned)

on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Show available Xcode versions
        run: ls /Applications | grep Xcode

      - name: Build (debug, simulator, self-signed)
        run: |
          python3 build-system/Make/Make.py \
            --overrideXcodeVersion \
            --cacheDir "$HOME/telegram-bazel-cache" \
            build \
            --configurationPath build-system/ci-configuration.json \
            --codesigningInformationPath build-system/fake-codesigning \
            --disableProvisioningProfiles \
            --buildNumber=1 \
            --configuration=debug_sim_arm64

      - name: Collect build output
        if: always()
        run: |
          mkdir -p ci-output
          find bazel-bin/Telegram -maxdepth 2 -iname "Telegram*" -exec cp -R {} ci-output/ \; 2>/dev/null || true

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: airagram-sim-build
          path: ci-output
          if-no-files-found: warn
          retention-days: 14
